apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-neutral definitions. Everything that differs between clusters — the storage class,
# where the model weights are mounted from, whether a RuntimeClass is needed — lives in an
# overlay, so the same workload definition is deployed everywhere.
resources:
  - 00-namespace.yaml
  - 10-pgvector.yaml
  - 20-vllm.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: visual-rag
