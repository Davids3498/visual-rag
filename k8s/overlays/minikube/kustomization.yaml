apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# minikube with `--driver=docker --gpus=all`: the node container already runs the NVIDIA
# runtime as its default, so no RuntimeClass is needed, and the device plugin comes from the
# `nvidia-device-plugin` addon rather than this repo's DaemonSet.
resources:
  - ../../base

patches:
  - path: storage-class.yaml
    target:
      kind: StatefulSet
      name: pgvector
  - path: node-sized.yaml
    target:
      kind: Deployment
      name: vllm
