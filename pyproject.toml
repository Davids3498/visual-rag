[project]
name = "visual-rag"
version = "0.1.0"
description = "Self-hosted visual RAG: ColQwen2 late-interaction retrieval vs a text baseline, served on GPU."
readme = "README.md"
requires-python = "==3.12.*"

# Part 0/1 only needs data plumbing. Heavy ML deps live in the optional groups
# below so `uv sync` stays fast until the step that actually needs them.
dependencies = [
    "datasets>=3.0",
    "huggingface-hub[hf-xet]>=0.34",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "pillow>=10.4",
    "tqdm>=4.66",
    "rich>=13.7",
    "requests>=2.32",
]

[project.optional-dependencies]
# Step 2-3: text baseline + ColQwen2 visual retrieval.  `uv sync --extra retrieval`
retrieval = [
    "torch>=2.5",
    "transformers>=4.49",
    "sentence-transformers>=3.3",
    "colpali-engine>=0.3.8",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # the reference trec_eval implementation — the leaderboard's own scorer, so my NDCG
    # cannot quietly disagree with the published numbers
    "pytrec-eval-terrier>=0.5.6",
]
# vLLM is deliberately NOT a dependency here: step 5 serves Qwen2.5-VL from its own
# container image on k3s, so it never has to co-resolve with the retriever stack.

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
